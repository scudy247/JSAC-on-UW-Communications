# Replay diagnostic on Blue segments (writes the canonical results/diagnostic/<file>/).
# Add segments here after downloading them (blue_1 ... blue_20).
name: diagnostic
script: scripts/replay_diagnostic.py
versioned: false
parallel: 8
runs:
  - [blue_1, blue_noise, --elements, 0, 5, 11, --frame_step, 2.0, --fs, 48000]
  - [blue_2, blue_noise, --elements, 0, 5, 11, --frame_step, 2.0, --fs, 48000]
  - [blue_5, blue_noise, --elements, 0, 5, 11, --frame_step, 2.0, --fs, 48000]
  - [blue_8, blue_noise, --elements, 0, 5, 11, --frame_step, 2.0, --fs, 48000]
  - [blue_11, blue_noise, --elements, 0, 5, 11, --frame_step, 2.0, --fs, 48000]
  - [blue_14, blue_noise, --elements, 0, 5, 11, --frame_step, 2.0, --fs, 48000]
  - [blue_17, blue_noise, --elements, 0, 5, 11, --frame_step, 2.0, --fs, 48000]
  - [blue_20, blue_noise, --elements, 0, 5, 11, --frame_step, 2.0, --fs, 48000]
