# Noise census content check (reports/noise_census.md §4, step 1). Model-free statistics
# only. Sources are public and open; see the census for licences. Deferred: West Bay (S3).
name: b_noise_check
block_s: 60.0        # statistics per 60 s block
warmup_s: 1.0        # discard band-pass transient at the start of each file
k_sigma: 5.0         # exceedance threshold in robust sigmas
clip_level: 0.999    # |x| >= this (full scale = 1) counts as clipped (raw, before filtering)
bands_hz:            # library channel bands (reports/library_notes.md §2)
  blue: [10500.0, 15500.0]
  purple: [9200.0, 15800.0]
  red: [20000.0, 30000.0]
files:
  # S1 SanctSound Florida Keys FK01, 48 kHz, continuous 6.00 h (FLAC header, 2026-09-30)
  - id: S1_fk01
    url: https://storage.googleapis.com/noaa-passive-bioacoustic/sanctsound/audio/fk01/sanctsound_fk01_01/audio/SanctSound_FK01_01_671359016_20181218T214011Z.flac
    bands: [blue, purple, red]          # red skipped automatically (above Nyquist)
    expected_fs_hz: 48000
    expected_duration_s: 21600
