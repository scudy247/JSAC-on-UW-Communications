# Layer 1, branch E: reward = gamma-hat in dB from pilot EVM (256 symbols) under complex SaS noise
# (alpha = 1.6). NIR-UCB v0 uses the identity noise->reward map: MIS-SPECIFIED here (shown on purpose).
name: b_layer1_E_a16
reward_model: evm_db
seed: 20260930
n_seeds: 50
T: 10000
nu: 200
tau_rt_slots: 3
noise: {alpha: 1.6, c: 0.1}
arms: {snr_db: [0.0, 1.0, 1.5, 2.0]}            # arm = transmit power offset (dB)
evm: {n_sym: 256, mc_packets: 200000, mc_seed: 7}
ack_threshold: 8.0
agents:
  - {name: "UCB (naive, oracle sigma)", type: empirical_ucb, params: {sigma: oracle}}
  - {name: "Gaussian TS (naive)", type: gaussian_ts, params: {sigma: oracle}}
  - {name: "ACK UCB1", type: ack_ucb1}
  - {name: "ACK Bernoulli TS", type: bernoulli_ts}
  - {name: "Trunc-mean UCB (oracle, eps=1)", type: trunc_ucb, params: {eps: 1.0}}
  - {name: "MoM UCB (oracle, eps=1)", type: mom_ucb, params: {eps: 1.0}}
  - {name: "AdaR-UCB", type: adar_ucb}
  - {name: "NIR-UCB v0 (misspecified)", type: nir_ucb, params: {min_noise_samples: 1000}}
